name: public-check

# Fails if a file of a maintainer-only working directory is tracked (plans, internal notes, local agent settings).
# Cheap and without a path filter, so docs-only changes and draft PRs are checked too. The job name is a required
# status check of the ruleset for develop and main; keep it.
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-check:
    name: public check (no private files or content)
    if: github.repository == 'sebllll/VL.Qt'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tracked paths
        run: |
          if git ls-files | grep -E '^(plan|docs-internal|\.claude|\.alta)/|^CLAUDE\.local\.md$'; then
            echo "::error::These files belong to a private working directory and must not be tracked."
            exit 1
          fi
