name: build

# Tiers (resource use): PR (not draft) = x64 only (win-x64 QtNative + unit tests + SmokeTest, linux-x64; pack places
# win-x64 only and builds/tests, no .nupkg); draft PRs and docs/help-only changes do not run. No build on the merge
# push (the PR already ran the same code). Branches: work PRs go to develop, main only gets releases (PR develop -> main,
# then tag v*).
# Public repo (github.event.repository.private == false): the hosted runners are free there, so the arm64 entries (win-arm64,
# linux-arm64) also run on PRs. The rest is the same; see docs/development.md.
# Tag v* = everything (all 4 RIDs win-x64/win-arm64/linux-x64/linux-arm64, tests, SmokeTest, one .nupkg VL.Qt with all
# RIDs, release). workflow_dispatch = like a tag, without release (the way to get a .nupkg from develop or main on demand); with
# sabotage != none only x64 matters (win-x64 + linux-x64, no arm64, no .nupkg). New jobs are gated from the start (#197):
# arm64 never runs on PRs (private repo). pack needs shim + linux: on FULL a failed RID job (also linux-arm64) blocks the .nupkg and the
# release; outside FULL only shim gates pack (a red linux-x64 does not hide the C# test results).
on:
  push:
    tags: ['v*']
  pull_request:
    branches: [develop, main]
    # ready_for_review: draft PRs are skipped (shim job condition), so the run starts when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', 'docs-internal/**', 'plan/**', '.claude/**', '.alta/**', 'help/**/*.vl', 'help/**/*.props', 'tools/issue-triage.ps1', 'tools/build.ps1', 'tools/vvvvc.ps1', 'tools/start-vvvv*', 'tools/*.py', '**/*.md', 'LICENSE*', '.gitignore', '.gitattributes', '.editorconfig', '.git-blame-ignore-revs', '.github/dependabot.yml']
  workflow_dispatch:
    inputs:
      sabotage:
        description: 'Negative test for the smoke job: delete a required file from the trimmed runtime before running'
        type: choice
        default: none
        options: [none, qwindows, qml-effects, qml-all]

# A newer push to the same PR/branch cancels the running one; tags always finish (unique group per run).
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # All 4 RIDs + .nupkg: push (tags only) and a plain workflow_dispatch.
  FULL: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sabotage == 'none') }}

jobs:
  # Job id stays "shim" (it builds QtNative, src/VL.Qt.Native): it is referenced by needs/if below.
  shim:
    name: QtNative (${{ matrix.rid }})
    # Draft PRs do not run; pack and smoke depend on this job and are skipped with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Native build per RID on a matching runner: windeployqt of the arm64 Qt is an arm64 exe and cannot run on x64.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # arm64 runs when FULL (tags, plain workflow_dispatch; the env context is not available here, so the FULL
        # expression is repeated) or on PRs in the public repo (free runners). Private repo PRs stay x64 only (#197).
        include: >-
          ${{ fromJSON((github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.sabotage == 'none')
          || (github.event_name == 'pull_request' && github.event.repository.private == false))
          && '[{"rid":"win-x64","os":"windows-2022"},{"rid":"win-arm64","os":"windows-11-arm"}]'
          || '[{"rid":"win-x64","os":"windows-2022"}]') }}
    env:
      QT_VERSION: '6.12.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Qt
        id: qtcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\Qt
          key: qt-${{ env.QT_VERSION }}-${{ matrix.rid }}-v3  # v3: + qtshadertools (qsb, #437); v2: + Qt Multimedia (Video, #115)

      # Python (aqtinstall/py7zr) is only needed to install Qt.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.qtcache.outputs.cache-hit != 'true'
        with:
          python-version: '3.12'

      - name: Qt (aqtinstall)
        shell: pwsh
        run: tools/setup-qt.ps1 -Rid ${{ matrix.rid }}

      - name: Build QtNative + windeployqt
        shell: pwsh
        run: tools/build-native.ps1 -Rid ${{ matrix.rid }}

      - name: Trim
        shell: pwsh
        run: tools/trim-deploy.ps1 -Rid ${{ matrix.rid }}

      - name: License check
        shell: pwsh
        run: tools/check-licenses.ps1 -Rid ${{ matrix.rid }}

      - name: Size
        shell: pwsh
        run: |
          $f = Get-ChildItem runtimes/${{ matrix.rid }}/native -Recurse -File
          "{0} files, {1:N1} MB, pdb: {2}" -f $f.Count, (($f | Measure-Object Length -Sum).Sum / 1MB), [bool]($f | Where-Object Extension -eq '.pdb')

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native
          if-no-files-found: error
          retention-days: 1   # only consumed by pack/smoke of the same run (artifact storage quota, #250)

  # Linux x64 (L5a, #106) + arm64 (L5b, #152): QtNative + Qt bundle (trim + license check inside deploy-linux.sh),
  # SmokeTest + dotnet test offscreen with the Qt Quick software backend (no X server; RHI/MultiEffect/video pixel
  # checks SKIP by design). Native build per RID on a matching runner (no cross-compile).
  # Runs in parallel to the Windows jobs (no needs); pack consumes native-linux-<rid> (L5c, #153).
  linux:
    name: linux (${{ matrix.rid }})
    # Same draft rule as shim: draft PRs do not run.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Same gate as shim/win-arm64 (saves minutes, #197): linux-arm64 on FULL or on PRs in the public repo.
        include: >-
          ${{ fromJSON((github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch' && inputs.sabotage == 'none')
          || (github.event_name == 'pull_request' && github.event.repository.private == false))
          && '[{"rid":"linux-x64","os":"ubuntu-24.04"},{"rid":"linux-arm64","os":"ubuntu-24.04-arm"}]'
          || '[{"rid":"linux-x64","os":"ubuntu-24.04"}]') }}
    env:
      QT_VERSION: '6.12.0'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Toolchain + Qt runtime deps (same package list as local WSL setup); .NET comes from setup-dotnet.
      - name: apt packages
        run: tools/setup-wsl.sh --no-dotnet

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache Qt
        id: qtcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Qt   # default Qt root of setup-qt/build-native/deploy-linux (VLQT_QT_ROOT unset)
          key: qt-${{ env.QT_VERSION }}-${{ matrix.rid }}-v2  # v2: + qtshadertools (qsb, #437)

      # aqtinstall host/arch per RID inside setup-qt.sh (linux/linux_gcc_64, linux_arm64/linux_gcc_arm64).
      # On a cache hit setup-qt.sh only verifies the install (version, Shapes, Multimedia/FFmpeg, qml tool).
      - name: Qt (aqtinstall)
        run: tools/setup-qt.sh --rid ${{ matrix.rid }}

      - name: Build QtNative
        run: tools/build-native.sh --rid ${{ matrix.rid }}

      - name: Deploy Qt bundle (+ trim, license check)
        run: tools/deploy-linux.sh --rid ${{ matrix.rid }}

      - name: Size
        run: |
          d=runtimes/${{ matrix.rid }}/native
          echo "$(find $d -type f | wc -l) files, $(du -sm $d | cut -f1) MB"

      - name: Tests (offscreen, software backend)
        env:
          VLQT_PERF_WARN_ONLY: '1'   # timing limits are not reliable on shared runners
        run: tools/test-linux.sh --rid ${{ matrix.rid }} --software --skip-native

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-${{ matrix.rid }}-logs
          path: build/test-linux-${{ matrix.rid }}
          if-no-files-found: ignore
          retention-days: 3

      # Only FULL packs the Linux runtimes into the .nupkg; PRs skip the upload (artifact storage quota, #250).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FULL == 'true'
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native
          if-no-files-found: error
          retention-days: 1   # only consumed by pack of the same run

  pack:
    name: pack (C# build, tests, .nupkg)
    needs: [shim, linux]
    # FULL (same expression as env.FULL, env is not available here): every shim + linux RID must succeed. Otherwise only
    # shim; linux is waited for but may fail (it uploads nothing outside FULL anyway).
    if: >-
      !cancelled() && needs.shim.result == 'success'
      && (needs.linux.result == 'success'
          || !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.sabotage == 'none')))
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VLQT_PERF_WARN_ONLY: '1'   # timing limits are not reliable on shared runners
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download native runtimes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ env.FULL == 'true' && 'native-*' || 'native-win-x64' }}
          path: native-artifacts

      # FULL: all 4 RIDs (same set as the shim/linux matrices). Otherwise win-x64 only: the C# build/tests need no Linux
      # runtime, and the linux job uploads nothing outside FULL (#250). Linux files are plain files (deploy-linux.sh: no
      # symlinks, libs 644, no executables), so losing permissions in the artifact and the .nupkg does not matter (dlopen
      # needs no x bit). download-artifact >= v5 extracts a single matching artifact directly into `path` (no
      # native-<rid> subfolder), so with one RID the artifact folder itself is the source.
      - name: Place runtimes/<rid>/native
        shell: pwsh
        run: |
          $rids = @(if ($env:FULL -eq 'true') { 'win-x64', 'win-arm64', 'linux-x64', 'linux-arm64' } else { 'win-x64' })
          foreach ($rid in $rids) {
            $src = "native-artifacts/native-$rid"
            if (-not (Test-Path $src) -and $rids.Count -eq 1) { $src = 'native-artifacts' }
            if (-not (Test-Path $src)) { throw "missing artifact native-$rid" }
            New-Item -ItemType Directory -Force "runtimes/$rid" | Out-Null
            Move-Item $src "runtimes/$rid/native"
          }

      - name: Package version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $v = $Matches[1] } else { $v = "0.1.0-ci.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Package version: $v"

      - name: Build (C#)
        run: dotnet build src/VL.Qt -c Release -v q -nologo -p:Version=${{ steps.ver.outputs.version }}

      - name: Test
        run: dotnet test src/VL.Qt.Tests -c Release -nologo --logger "console;verbosity=normal" --logger "trx;LogFileName=unit.trx" --results-directory build/test-results

      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-win-logs
          path: build/test-results
          if-no-files-found: ignore
          retention-days: 3

      # .nupkg only with all 4 RIDs (tags, plain workflow_dispatch); PRs stop after the tests.
      - name: Pack
        if: env.FULL == 'true'
        run: dotnet pack src/VL.Qt -c Release --no-build -v q -nologo -p:Version=${{ steps.ver.outputs.version }} -o build/pack

      - name: Verify package (layout, size, metadata)
        if: env.FULL == 'true'
        shell: pwsh
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $pkg = Get-ChildItem build/pack -Filter *.nupkg | Select-Object -First 1
          if (-not $pkg) { throw 'no .nupkg produced' }
          $mb = $pkg.Length / 1MB
          "{0}: {1:N1} MB (nuget.org limit 250 MB, warning from 200 MB)" -f $pkg.Name, $mb
          if ($mb -ge 250) { throw "package too large: $mb MB" }
          if ($mb -ge 200) { "::warning::package {0:N1} MB, close to the 250 MB nuget.org limit" -f $mb }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try { $entries = @($zip.Entries | Select-Object FullName, CompressedLength, Length) } finally { $zip.Dispose() }
          $names = @($entries | ForEach-Object FullName)
          $rids = 'win-x64', 'win-arm64', 'linux-x64', 'linux-arm64'
          $qtNative = @{ 'win-x64' = 'vlqt.dll', 'Qt6Core.dll'; 'win-arm64' = 'vlqt.dll', 'Qt6Core.dll'
                     'linux-x64' = 'libvlqt.so', 'libQt6Core.so.6'; 'linux-arm64' = 'libvlqt.so', 'libQt6Core.so.6' }
          # Package layout (#315): lib/net10.0/ (packman/dotnet ignore a flat lib/), Qt runtime in qt/<rid>/ (NuGet would
          # flatten runtimes/<rid>/native into the app), buildTransitive/VL.Qt.targets copies it into the app.
          $need = @('VL.Qt.vl', 'VL.Qt.vl.targets', 'LICENSES.md', 'lib/net10.0/VL.Qt.dll', 'buildTransitive/VL.Qt.targets', 'buildTransitive/VL.Qt.Shaders.targets',
                    'help/HelloWorld.vl', 'LICENSES/LGPL-3.0.txt')
          foreach ($rid in $rids) { $need += $qtNative[$rid] | ForEach-Object { "qt/$rid/$_" } }
          $missing = $need | Where-Object { $_ -notin $names }
          if ($missing) { throw "missing in package: $($missing -join ', ')" }
          $bad = @($names | Where-Object { $_ -like 'runtimes/*' -or $_ -like 'lib/VL.Qt.*' })
          if ($bad) { throw "NuGet asset folders must stay empty (#315): $($bad | Select-Object -First 5)" }
          # Metadata from the nuspec (nuget.org needs id, version, license; repository links the package to the source).
          $nuspecEntry = $names | Where-Object { $_ -like '*.nuspec' -and $_ -notlike '*/*' } | Select-Object -First 1
          if (-not $nuspecEntry) { throw 'no .nuspec in the package' }
          $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          try {
            $reader = [IO.StreamReader]::new($zip.GetEntry($nuspecEntry).Open())
            try { [xml]$nuspec = $reader.ReadToEnd() } finally { $reader.Dispose() }
          } finally { $zip.Dispose() }
          $meta = $nuspec.package.metadata
          $problems = @()
          if ($meta.id -ne 'VL.Qt') { $problems += "id is '$($meta.id)', expected VL.Qt" }
          if ($meta.version -ne $env:PKG_VERSION) { $problems += "version is '$($meta.version)', expected $env:PKG_VERSION" }
          if (-not $meta.license -and -not $meta.licenseUrl) { $problems += 'license missing' }
          if (-not $meta.repository.url) { $problems += 'repository url missing' }
          if ($problems) { throw "nuspec metadata: $($problems -join '; ')" }
          "nuspec: id {0}, version {1}, license {2}, repository {3}" -f $meta.id, $meta.version, $meta.license.InnerText, $meta.repository.url
          # Size per RID: sum of the entries under qt/<rid>/ (zipped = compressed, unpacked = uncompressed).
          foreach ($rid in $rids) {
            $e = @($entries | Where-Object FullName -like "qt/$rid/*")
            "qt/{0}/: {1} files, {2:N1} MB zipped, {3:N1} MB unpacked" -f $rid, $e.Count,
              (($e | Measure-Object CompressedLength -Sum).Sum / 1MB), (($e | Measure-Object Length -Sum).Sum / 1MB)
          }
          foreach ($rid in $rids) {
            foreach ($sub in 'plugins', 'qml') {
              $n = @($names | Where-Object { $_ -like "qt/$rid/$sub/*" }).Count
              "qt/$rid/$sub/: $n files"
              if ($n -eq 0) { throw "no files under qt/$rid/$sub/" }
            }
          }
          "{0} entries total" -f $names.Count

      # #315: consume the .nupkg like a vvvv export with a NuGet dependency (PackageReference from an exe project with RID,
      # dotnet publish): no NETSDK1152, VL.Qt.dll next to the exe, Qt tree structured in runtimes/<rid>/native.
      # A full vvvvc export against the package needs vvvv on the runner (self-hosted runner, see the follow-up issue).
      - name: Consume package (win-x64, linux-x64)
        if: env.FULL == 'true'
        shell: pwsh
        run: |
          $pkg = (Get-ChildItem build/pack -Filter *.nupkg | Select-Object -First 1).FullName
          foreach ($rid in 'win-x64', 'linux-x64') {
            ./tools/test-nupkg-consumer.ps1 -Package $pkg -Rid $rid -Work "build/nupkg-consumer-$rid"
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.FULL == 'true'
        with:
          name: nupkg
          path: build/pack/*.nupkg
          if-no-files-found: error
          # Tag: the release asset keeps the .nupkg, the artifact only bridges to the release job.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 7 }}

  smoke:
    name: smoke (SmokeTest vs trimmed runtime, win-x64)
    needs: shim
    # Only x64: one RID proves the trimmed deployment; the arm64 runner has no GPU either.
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      VLQT_PERF_WARN_ONLY: '1'   # timing limits are not reliable on shared runners
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # FFmpeg: no hardware decoding (WARP runner has none; avoids the dxva2_vld/AVHWFramesContext messages).
      # Qt reads a comma list; a set but empty-item list means "no device types" (",": set on Windows, no "unknown type" warning).
      QT_FFMPEG_DECODING_HW_DEVICE_TYPES: ','
      # FFmpeg's "Input #0 … Stream …" dump (av_dump_format) is gated by this category's info level in Qt.
      # QT_LOGGING_RULES only adds/overrides these rules; vlqt's qt.rhi/qt.scenegraph rules stay active.
      QT_LOGGING_RULES: 'qt.multimedia.ffmpeg.mediadataholder.info=false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', '**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download trimmed native runtime (win-x64)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-win-x64
          path: runtimes/win-x64/native

      - name: Sabotage (negative test, workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.sabotage != 'none'
        shell: pwsh
        run: |
          $n = 'runtimes/win-x64/native'
          switch ('${{ inputs.sabotage }}') {
            'qwindows'  { Remove-Item "$n/plugins/platforms/qwindows.dll" -Force }
            'qml-effects' { Remove-Item "$n/qml/QtQuick/Effects" -Recurse -Force }
            'qml-all'     { Remove-Item "$n/qml" -Recurse -Force }
          }
          "sabotaged: ${{ inputs.sabotage }}"

      - name: Build SmokeTest (win-x64)
        run: dotnet build src/VL.Qt.SmokeTest -c Release -v q -nologo -p:RuntimeIdentifier=win-x64

      # The full log (incl. qt.rhi/qt.scenegraph debug, which the SmokeTest checks itself) goes to smoke-out/;
      # the job log shows only the summary, the full logs are printed and uploaded on failure.
      - name: Run SmokeTest
        shell: pwsh
        run: |
          $exe = Get-ChildItem src/VL.Qt.SmokeTest/bin -Recurse -Filter VL.Qt.SmokeTest.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force smoke-out | Out-Null
          # A crash must fail fast instead of waiting for the invisible Windows Error Reporting dialog.
          New-Item -Force 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name DontShowUI -Value 1 -Type DWord
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name Disabled -Value 1 -Type DWord
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process $exe.FullName -ArgumentList 'smoke-out/grabs' -NoNewWindow -PassThru -RedirectStandardOutput smoke-out/stdout.log -RedirectStandardError smoke-out/stderr.log
          # 5 min: the run takes ~150-175 s on the hosted runner, 3 min was too tight (#65 hit it with 0 FAIL).
          if (-not $p.WaitForExit(300000)) { $p.Kill($true); throw 'SmokeTest timeout (5 min)' }
          $p.WaitForExit()
          $out = Get-Content smoke-out/stdout.log
          "SmokeTest exit code {0}, {1:N0} s, {2} PASS, {3} FAIL" -f $p.ExitCode, $sw.Elapsed.TotalSeconds,
            @($out -match '^PASS ').Count, @($out -match '^FAIL ').Count
          $out -match '^(FAIL|WARN|SMOKE) '
          $err = @(Get-Content smoke-out/stderr.log)
          "stderr: {0} lines, FFmpeg noise (Input #/Stream #/dxva2/AVHWFramesContext): {1}" -f $err.Count, @($err -match 'Input #|Stream #|dxva2|AVHWFramesContext').Count
          if ($p.ExitCode -ne 0) { throw "SmokeTest failed (exit $($p.ExitCode))" }

      # Device lost (#367): the D3D11 device is removed for real (D3D11On12), with the software D3D11 adapter (WARP).
      - name: Run SmokeTest device-lost (WARP)
        shell: pwsh
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
        run: |
          $exe = Get-ChildItem src/VL.Qt.SmokeTest/bin -Recurse -Filter VL.Qt.SmokeTest.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList 'smoke-out/devicelost','--only','device-lost' -NoNewWindow -PassThru -RedirectStandardOutput smoke-out/devicelost-stdout.log -RedirectStandardError smoke-out/devicelost-stderr.log
          if (-not $p.WaitForExit(120000)) { $p.Kill($true); throw 'device-lost timeout (2 min)' }
          $p.WaitForExit()
          $out = Get-Content smoke-out/devicelost-stdout.log
          $out -match '^(PASS|FAIL|INFO 367|SMOKE) ' | Select-Object -Last 40
          if ($p.ExitCode -ne 0) {
            # QtNative's log (vlqt.device, Qt warnings) goes to stdout with the PASS/FAIL lines.
            '--- devicelost-stdout.log (vlqt.device, device lost, last 30) ---'
            $out | Select-String 'vlqt\.device|device lost|Device loss' | Select-Object -Last 30 | ForEach-Object Line
            throw "device-lost failed (exit $($p.ExitCode))"
          }

      - name: Diagnostics (on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-CimInstance Win32_VideoController | ForEach-Object { "GPU: {0} (driver {1})" -f $_.Name, $_.DriverVersion }
          "Session: $env:SESSIONNAME, user $env:USERNAME, OS $([Environment]::OSVersion.Version)"
          Get-ChildItem runtimes/win-x64/native/plugins/platforms -ErrorAction SilentlyContinue | ForEach-Object Name
          if (Test-Path smoke-out/stdout.log) { '--- stdout (last 60) ---'; Get-Content smoke-out/stdout.log -Tail 60 }
          if (Test-Path smoke-out/stderr.log) { '--- stderr (last 30) ---'; Get-Content smoke-out/stderr.log -Tail 30 }

      - name: Upload logs and grabs (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failure
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 3

  # Releases only come from main: the tag commit must be an ancestor of origin/main (PR develop -> main, then the tag).
  # A tag on any other commit still builds and tests (pack), but publishes nothing.
  release-gate:
    name: release gate (tag on main)
    needs: [pack, smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      on-main: ${{ steps.check.outputs.on-main }}
    steps:
      # Full history: merge-base needs the commits between the tag and the tip of main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag commit is on main
        id: check
        run: |
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "on-main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on-main=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: no release, no nuget.org push. Releases are tagged on main only."
          fi

  release:
    name: release asset (tag v*)
    needs: [release-gate]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-gate.outputs.on-main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Protected environment: the nuget.org Trusted Publishing policy is bound to build.yml in this environment, and the
    # variable NUGET_USER (nuget.org profile name) lives here. PR jobs never get id-token.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkg
          path: nupkg

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkg/*.nupkg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

      # nuget.org push with Trusted Publishing (OIDC, no stored API key). Only sebllll/VL.Qt publishes (the policy on
      # nuget.org is bound to it; forks and private copies would fail the login), and only if NUGET_USER is set;
      # otherwise a notice, no failure. Keyed on the name, not on public: releases go to nuget.org while it is private.
      - name: Check nuget.org push
        id: nuget
        env:
          IS_MAIN_REPO: ${{ github.repository == 'sebllll/VL.Qt' }}
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ "$IS_MAIN_REPO" != 'true' ]; then
            echo "::notice::Not pushed to nuget.org: only sebllll/VL.Qt publishes the package."
          elif [ -z "$NUGET_USER" ]; then
            echo "::notice::Not pushed to nuget.org: variable NUGET_USER is not set in the environment release (see docs/development.md, Release)."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: nuget.org login (Trusted Publishing)
        id: nuget-login
        if: steps.nuget.outputs.push == 'true'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        if: steps.nuget.outputs.push == 'true'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
