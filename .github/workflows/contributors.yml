name: contributors

# Regenerates CONTRIBUTORS.md after every push to develop or main, active only in the public repository.
# Signers of the CLA (signatures/cla.json on the branch cla-signatures) with at least one merged pull request are
# listed; logins in signatures/optout.txt on the same branch are left out. Commits only if the file changed.
# The push uses the github-actions bot: branch protection must allow it to push to develop and main (bypass list).
# A push with GITHUB_TOKEN does not start further workflow runs.
on:
  push:
    branches: [develop, main]
    paths-ignore: ['CONTRIBUTORS.md']

permissions:
  contents: write
  pull-requests: read

jobs:
  contributors:
    runs-on: ubuntu-latest
    # Public repo only (needs the cla-signatures branch); not in forks, not while the repository is private.
    if: github.repository == 'sebllll/VL.Qt' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read signatures and merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/contrib"
          git fetch origin cla-signatures
          git show origin/cla-signatures:signatures/cla.json > "$RUNNER_TEMP/contrib/cla.json"
          git show origin/cla-signatures:signatures/optout.txt > "$RUNNER_TEMP/contrib/optout.txt" 2>/dev/null || : > "$RUNNER_TEMP/contrib/optout.txt"
          gh pr list --state merged --limit 5000 --json author --jq '.[].author.login' > "$RUNNER_TEMP/contrib/merged.txt"

      - name: Write CONTRIBUTORS.md
        run: >
          python3 tools/update-contributors.py
          --signatures "$RUNNER_TEMP/contrib/cla.json"
          --merged "$RUNNER_TEMP/contrib/merged.txt"
          --optout "$RUNNER_TEMP/contrib/optout.txt"
          --include sebllll
          --out CONTRIBUTORS.md

      - name: Commit if changed
        run: |
          if git diff --quiet -- CONTRIBUTORS.md; then
            echo "CONTRIBUTORS.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md
          git commit -m "Update CONTRIBUTORS.md"
          git push
